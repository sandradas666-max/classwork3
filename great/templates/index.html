<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Employee Directory</title>
</head>
<body>
	<h1>Employee Directory</h1>

	{% if employees %}
		<ul>
			{% for employee in employees %}
				<li>
					<strong>{{ employee.name }}</strong> — {{ employee.job_title }} — Salary: {{ employee.salary }}
					{% if employee.is_full_time %}
						<span style="color: green;">Full-Time</span>
					{% else %}
						<span style="color: red;">Part-Time</span>
					{% endif %}
				</li>
			{% endfor %}
		</ul>
	{% else %}
		<p>No employees available.</p>
	{% endif %}
</body>
</html>
